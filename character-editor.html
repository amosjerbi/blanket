:root { --ink: #262418; --panel: #332f25; --line: #4d4737; --paper: #fbf7f0; --muted: #a1c4de; --accent: #f2c14e; }
* { box-sizing: border-box; border-radius: 0; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: Silk, ui-monospace, monospace; font-size: 12px; -webkit-font-smoothing: none; }
button, input, select { font: inherit; color: inherit; }
button { border: 0; cursor: pointer; background: var(--line); min-height: 36px; padding: 0 10px; }
button:hover { background: #6a6048; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 1px; }

#app { display: grid; grid-template-columns: minmax(0, 1fr) 372px; height: 100dvh; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #93c7f8; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view.pixel { image-rendering: pixelated; }
#view:active { cursor: grabbing; }
#view-top, #view-bottom { position: absolute; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
#view-top { top: calc(env(safe-area-inset-top) + 10px); }
#view-bottom { bottom: 10px; }
.seg, .chip { pointer-events: auto; }
.seg { display: flex; background: var(--ink); padding: 2px; }
.seg button { background: transparent; min-height: 32px; }
.seg button.on { background: var(--paper); color: var(--ink); }
.chip { background: var(--ink); min-height: 36px; }
.chip.on { background: var(--accent); color: var(--ink); }

#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 2px solid var(--ink); }
#panel header { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 6px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; }
#status { color: var(--muted); font-size: 10px; }
#tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 0 14px 10px; }
#tabs button { padding: 0; min-height: 34px; font-size: 9px; overflow: hidden; }
#tabs button.on { background: var(--accent); color: var(--ink); }
#controls { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 12px; overscroll-behavior: contain; }
fieldset { margin: 0 0 10px; padding: 8px 0 0; border: 0; border-top: 2px solid var(--line); }
legend { padding: 0 8px 0 0; color: var(--accent); font-weight: 700; }
.field { display: grid; grid-template-columns: 112px minmax(0, 1fr) 38px; align-items: center; gap: 8px; min-height: 30px; }
.field output { text-align: right; color: var(--muted); font-size: 10px; }
.text { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 5px; }
.text input { width: 100%; min-height: 32px; padding: 0 7px; background: var(--ink); border: 1px solid var(--line); }
input[type=range] { width: 100%; height: 24px; margin: 0; accent-color: var(--accent); }
#expressions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; }
#expressions button { min-height: 34px; }
#expressions button.on { background: var(--paper); color: var(--ink); }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 5px; }
.options button.on { background: var(--paper); color: var(--ink); }
input[type=range]:disabled { opacity: .35; }
.swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; }
.swatches label { display: flex; align-items: center; justify-content: space-between; min-height: 32px; gap: 6px; }
input[type=color] { width: 42px; height: 26px; padding: 0; border: 1px solid var(--paper); background: none; cursor: pointer; }
footer { display: grid; gap: 5px; padding: 10px 14px calc(env(safe-area-inset-bottom) + 12px); border-top: 2px solid var(--ink); }
#apply-all { background: var(--accent); color: var(--ink); font-weight: 700; }
#apply-all:hover { background: #f6d98a; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.primary { display: flex; align-items: center; justify-content: center; min-height: 42px; background: var(--paper); color: var(--ink); font-weight: 700; font-size: 14px; text-align: center; text-decoration: none; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 42dvh minmax(0, 1fr); }
  #panel { border-left: 0; border-top: 2px solid var(--ink); }
  #panel header { padding-top: 8px; }
  footer { grid-template-columns: 1fr 1fr 1fr; }
  footer .row { grid-column: span 1; grid-template-columns: 1fr; }
  footer button { min-height: 32px; font-size: 10px; }
  #apply-all { grid-column: 1 / -1; }
}
</style>
</head>
<body>
  <main id="app">
    <section id="stage" aria-label="Character preview">
      <canvas id="view" aria-label="3D character preview. Drag to rotate, scroll to zoom."></canvas>
      <div id="view-top">
        <div class="seg" role="group" aria-label="Pose">
          <button data-pose="hill" class="on">Arms up</button>
          <button data-pose="wrapped">Wrapped</button>
        </div>
        <div class="seg" role="group" aria-label="Camera">
          <button data-cam="body" class="on">Body</button>
          <button data-cam="face">Face</button>
        </div>
      </div>
      <div id="view-bottom">
        <div class="seg" role="group" aria-label="Render style">
          <button data-style="pixel" class="on">Pixel</button>
          <button data-style="smooth">Smooth</button>
        </div>
        <button id="spin" class="chip" aria-pressed="false">Auto spin</button>
      </div>
    </section>

    <aside id="panel" aria-label="Character settings">
      <header>
        <h1>Characters</h1>
        <span id="status" role="status">Saved</span>
      </header>
      <nav id="tabs" aria-label="Choose character"></nav>
      <div id="controls"></div>
      <footer>
        <button id="apply-all">Apply to all</button>
        <div class="row">
          <button id="reset-one">Reset character</button>
          <button id="reset-all">Reset all</button>
        </div>
        <div class="row">
          <button id="export">Download</button>
          <button id="import">Import</button>
          <input id="import-file" type="file" accept=".js,.json,text/javascript,application/json" hidden>
        </div>
        <a id="play-hill" class="primary" href="index.html">Test in game</a>
      </footer>
    </aside>
  </main>
