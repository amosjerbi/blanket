:root { --ink: #262418; --paper: #fbf7f0; --mid: #7a6a4f; --accent: #f2c14e; }
* { box-sizing: border-box; border-radius: 0; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: Silk, ui-monospace, monospace; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
/* Newer mobile browsers tint their bars from the page, so phones get the sky colour too. */
@media (pointer: coarse) { html, body { background: #93c7f8; } }
#stage { position: relative; height: 100dvh; width: min(100vw, calc(100dvh * 10 / 16)); margin: 0 auto; overflow: hidden; background: var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: calc(env(safe-area-inset-top) + 62px) 14px calc(env(safe-area-inset-bottom) + 14px); pointer-events: none; }
.screen button, .screen a { pointer-events: auto; }
.brand { animation: drop .36s steps(5) both; }
.title { margin: 0; font-weight: 700; font-size: clamp(36px, 11.6vw, 60px); line-height: .92; text-shadow: 3px 3px 0 var(--ink); }
.ribbon { width: 176px; height: 10px; margin: 12px auto 0; box-shadow: 3px 3px 0 var(--ink); background: linear-gradient(90deg, #a63f78 12.5%, #e6b53f 0 25%, #f3ead6 0 37.5%, #d95f43 0 50%, #3f6fa8 0 62.5%, #c48bd0 0 75%, #f19aa4 0 87.5%, #2f8b86 0); }
.actions { width: min(100%, 340px); margin-top: auto; margin-bottom: clamp(16px, 6.5dvh, 64px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; animation: rise .36s steps(5) both; }
#char-prev, #char-next { position: absolute; top: 50%; width: 60px; height: 60px; margin-top: -30px; background: transparent; color: var(--paper); font-size: 40px; text-shadow: 3px 3px 0 var(--ink); }
#char-prev { left: 2px; }
#char-next { right: 2px; }
.who { position: absolute; left: 14px; right: 14px; top: 66%; display: flex; flex-direction: column; align-items: center; }
#char-name { width: 100%; overflow: hidden; color: var(--paper); font-size: 40px; font-weight: 700; line-height: 1.1; text-overflow: ellipsis; text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; }
.primary { width: 100%; min-height: 54px; background: #fff; color: var(--ink); font-size: 18px; font-weight: 700; box-shadow: 0 4px 0 var(--ink); }
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.square { width: 44px; height: 44px; flex: none; background: var(--ink); font-size: 15px; }
.square:active { background: var(--paper); color: var(--ink); }
#customize { display: inline-flex; align-items: center; min-height: 36px; padding: 0 8px; color: var(--paper); font-size: 16px; text-decoration: none; text-shadow: 2px 2px 0 var(--ink); }
#customize:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
#btn-sound { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 10px; display: grid; place-items: center; background: var(--ink); }
#btn-sound svg { width: 20px; height: 20px; fill: currentColor; }
#btn-github { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 60px; display: grid; place-items: center; color: var(--paper); }
#btn-github svg { width: 20px; height: 20px; fill: currentColor; }
#btn-github:active { color: var(--ink); }
#btn-github:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
#btn-sound .mute { display: none; }
#btn-sound[aria-pressed="false"] .waves { display: none; }
#btn-sound[aria-pressed="false"] .mute { display: block; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@media (max-height: 620px) {
  .screen { padding-top: calc(env(safe-area-inset-top) + 58px); }
  .title { font-size: 33px; }
  #char-name { font-size: 30px; }
  .ribbon { width: 120px; height: 7px; margin-top: 7px; }
  .primary { min-height: 46px; font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .brand, .actions { animation: none; } }

#hud { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 10px); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
#pips { display: grid; grid-template-columns: repeat(10, 14px); gap: 3px; padding: 4px; filter: drop-shadow(1px 1px 0 var(--ink)); }
#pips i { width: 14px; height: 14px; background: var(--mid); }
#pips i.on { background: var(--pip); box-shadow: inset 0 0 0 2px #fff; }
#pips.dense { grid-template-columns: repeat(20, 8px); gap: 2px; }
#pips.dense i { width: 8px; height: 8px; }
#pips.dense i.on { box-shadow: inset 0 0 0 1px #fff; }
#count { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 6px; font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 var(--ink); }
#count-amount { font-size: 26px; font-weight: 700; line-height: 1.05; }
#count-phase { font-size: 13px; line-height: 1.1; }
#toast { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); color: #fff; font-size: 26px; font-weight: 700; line-height: 1.05; text-align: center; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
#hint { position: absolute; left: 50%; top: calc(100dvh - env(safe-area-inset-top) - 52px); width: max-content; max-width: 92%; margin: 0; padding: 3px 6px; transform: translateX(-50%); background: var(--ink); font-size: 10px; text-align: center; }
#hint.gone { display: none; }

#stick { position: absolute; width: 116px; height: 116px; margin: -58px 0 0 -58px; background: rgba(38, 36, 24, .3); box-shadow: inset 0 0 0 2px var(--paper); pointer-events: none; }
#stick-thumb { position: absolute; left: 34px; top: 34px; width: 48px; height: 48px; background: var(--paper); }

#snug { position: absolute; left: 0; right: 0; top: 19%; text-align: center; pointer-events: none; }
#snug h2 { margin: 0; font-size: clamp(28px, 9vw, 38px); font-weight: 700; text-shadow: 3px 3px 0 var(--ink); }
#snug p { display: inline-block; margin: 6px 0 0; padding: 3px 6px; background: var(--ink); font-size: 11px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="A character rolling on a grassy hill"></canvas>

    <section id="hud" class="hidden" aria-label="Blankets collected">
      <div id="pips" aria-hidden="true"></div>
      <div id="count" role="status"><span id="count-amount">0 of 10</span> <span id="count-phase">Phase 1</span></div>
      <p id="hint">Drag or use arrow keys to roll</p>
    </section>

    <div id="toast" class="hidden" role="status"></div>

    <div id="stick" class="hidden" aria-hidden="true"><b id="stick-thumb"></b></div>

    <section id="snug" class="hidden" role="status">
      <h2>All snug!</h2>
      <p id="snug-count"></p>
    </section>

    <section id="menu" class="screen" aria-label="Start menu">
      <a class="square" id="btn-github" href="https://github.com/amosjerbi/roll" target="_blank" rel="noopener" aria-label="View on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <header class="brand">
        <h1 class="title">WRAP N'<br>ROLL</h1>
        <div class="ribbon" aria-hidden="true"></div>
      </header>
      <button class="square" id="char-prev" aria-label="Previous character">&lt;</button>
      <button class="square" id="char-next" aria-label="Next character">&gt;</button>
      <div class="who">
        <div id="char-name" role="status"></div>
        <a id="customize" href="character-editor.html">Customize</a>
      </div>
      <div class="actions">
        <button class="primary" id="btn-start">Start rolling</button>
      </div>
    </section>

    <button class="square" id="btn-sound" aria-pressed="true" aria-label="Sound on">
      <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
        <path d="M2 6h3V5h1V4h1V3h1v10H7v-1H6v-1H5v-1H2z"/>

        <path class="mute" d="M10 5h1v1h1v1h1V6h1V5h1v1h-1v1h-1v2h1v1h1v1h-1v-1h-1V9h-1v1h-1v1h-1v-1h1V9h1V7h-1V6h-1z"/>
      </svg>
    </button>
  </div>
